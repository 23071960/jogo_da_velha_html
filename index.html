<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <span class="titulo">Tic-tac-toe - Jogo da velha</span>
    </header>
    <div class="game-container">
        <div class="scoreboard">
            <span id="player1Wins">Jogador 1: 0</span>
            <span id="player2Wins">Jogador 2: 0</span>
            <span id="draws">Empates: 0</span>
        </div>
        <div class="board" id="board">
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
        </div>
        <div class="winning-message" id="winningMessage">
            <div data-winning-message-text></div>
        </div>
        <button id="restartButton">Recomeçar</button>
        <button id="resetScoreButton">Zerar Placar</button>
    </div>
    <footer>
        Trabalho realizado pelos alunos fulano e cicrano<br>
        para a Feira do conhecimento - CASS - 2024
    </footer>
    <script src="script.js"></script>
</body>
</html>
